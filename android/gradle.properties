org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project is on D: and the Pub cache is on C:. Kotlin incremental
# caches cannot relativize these paths on Windows.
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
